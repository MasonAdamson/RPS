<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fire Water Earth</title>
    <link rel="stylesheet" href="mradamso.lab8.css">
  </head>
  <body>
    <main>
        <h1>Fire, Water, Earth</h1>
        <h2><i>It's just Rock Paper Scissors</i></h2>
        
        <div id="game-container">
            <div id="choices">
                <div class="choice">
                    <img src="fire.png" alt="Fire" id="fire-btn" class="choice-btn">
                    <p>Fire</p>
                </div>
                <div class="choice">
                    <img src="water.png" alt="Water" id="water-btn" class="choice-btn">
                    <p>Water</p>
                </div>
                <div class="choice">
                    <img src="earth.png" alt="Earth" id="earth-btn" class="choice-btn">
                    <p>Earth</p>
                </div>
            </div>
            
            <div id="result-area">
                <div id="player-choice">You chose: <span id="user-selection"></span></div>
                <div id="cpu-choice">CPU chose: <span id="cpu-selection"></span></div>
                <div id="game-result"></div>
            </div>
        </div>
    </main>
    <script src="mradamso.lab8.js"></script>
  </body>
</html>
